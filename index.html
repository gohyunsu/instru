<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="실시간 반음 음정 확인과 MuseScore 악보 재생을 위한 모바일 음악 도구"
    />
    <meta name="theme-color" content="#f3f1eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>INSTRU · 음악 도구</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>INSTRU</span>
        </div>

        <div class="topbar-actions">
          <button
            class="listening-status"
            id="listeningStatus"
            type="button"
            aria-label="현재 작동 상태"
          >
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusLabel">연결 중</span>
          </button>
          <button class="icon-button" id="themeToggle" type="button" aria-label="다크 모드 켜기">
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 15.4A8 8 0 0 1 8.6 4a8.1 8.1 0 1 0 11.4 11.4Z"></path>
            </svg>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.6"></circle>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
            </svg>
          </button>
        </div>
      </header>

      <nav class="mode-switch" aria-label="기능 선택">
        <button class="mode-button is-active" type="button" data-mode="tuner" aria-pressed="true">
          음정
        </button>
        <button class="mode-button" type="button" data-mode="score" aria-pressed="false">
          악보 재생
        </button>
      </nav>

      <section class="mode-view tuner-view" id="tunerView">
        <section class="pitch-summary" id="pitchSummary" aria-labelledby="pitchNote">
          <div class="accuracy-effect" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div class="note-line">
            <span class="pitch-note" id="pitchNote">
              <span class="pitch-letter" id="pitchLetter">—</span>
              <span class="pitch-octave" id="pitchOctave"></span>
            </span>
          </div>
          <div class="deviation-line" id="deviationLine">
            <span class="deviation-value" id="deviationValue">마이크 연결 중</span>
            <span class="deviation-copy" id="deviationCopy"></span>
          </div>
          <p class="pitch-message" id="pitchMessage">한 음을 길게</p>
          <p class="helper-message" id="helperMessage"></p>
          <p class="sr-only" id="screenReaderStatus" aria-live="polite"></p>
        </section>

        <section class="pitch-graph" id="pitchGraph" aria-labelledby="graphTitle">
          <div class="graph-heading">
            <h1 id="graphTitle">음정 흐름</h1>
            <span>8초</span>
          </div>
          <div class="deviation-axis" aria-hidden="true">
            <span>낮음</span>
            <span>정확</span>
            <span>높음</span>
          </div>
          <div class="graph-stage">
            <canvas
              id="pitchCanvas"
              role="img"
              aria-label="아래쪽이 현재이고 위쪽이 과거인 세로 음정 편차 그래프. 왼쪽은 낮음, 가운데는 정확, 오른쪽은 높음을 뜻합니다."
            >
              실시간 음정 편차 그래프
            </canvas>
            <span class="time-label time-label-past" aria-hidden="true">8초 전</span>
            <span class="time-label time-label-now" aria-hidden="true">지금</span>
            <div class="graph-empty" id="graphEmpty">
              <span class="empty-line" aria-hidden="true"></span>
              <span id="graphEmptyText">한 음을 길게</span>
            </div>
          </div>
        </section>

        <section class="reference-section" aria-labelledby="referenceTitle">
          <div class="section-label">
            <h2 id="referenceTitle">기준음</h2>
          </div>
          <div class="reference-notes" id="referenceNotes">
            <button class="note-button" type="button" data-offset="-1" aria-label="한 반음 낮은 기준음 재생">
              <span class="note-button-label">
                <span class="note-button-name">G♯</span><span class="note-button-octave">4</span>
              </span>
            </button>
            <button class="note-button is-current" type="button" data-offset="0" aria-label="현재 기준음 재생">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M5.5 3.5v9l7-4.5-7-4.5Z"></path>
              </svg>
              <span class="note-button-label">
                <span class="note-button-name">A</span><span class="note-button-octave">4</span>
              </span>
            </button>
            <button class="note-button" type="button" data-offset="1" aria-label="한 반음 높은 기준음 재생">
              <span class="note-button-label">
                <span class="note-button-name">A♯</span><span class="note-button-octave">4</span>
              </span>
            </button>
          </div>
        </section>
      </section>

      <section class="mode-view score-view" id="scoreView" hidden>
        <section class="score-library" aria-labelledby="libraryTitle">
          <div class="section-label">
            <h1 id="libraryTitle">보관된 악보</h1>
            <span id="libraryCount">불러오는 중</span>
          </div>
          <div class="library-list" id="libraryList">
            <p class="library-empty">악보 목록을 확인하고 있습니다.</p>
          </div>
        </section>

        <section class="score-import" id="scoreImport">
          <input id="scoreFileInput" type="file" accept=".mscz,.mscx" hidden />
          <svg class="file-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M8 3.5h10l6 6V28H8V3.5Z"></path>
            <path d="M18 3.5V10h6M12 18h8M12 22h5"></path>
          </svg>
          <div>
            <h1>MuseScore 파일</h1>
            <p>.mscz · .mscx</p>
          </div>
          <button class="secondary-button" id="selectScoreButton" type="button">파일 선택</button>
        </section>

        <section class="score-player-panel" id="scorePlayerPanel" hidden>
          <header class="score-file-heading">
            <div>
              <h1 id="scoreTitle">제목 없음</h1>
              <p id="scoreMeta"></p>
            </div>
            <button class="text-button" id="replaceScoreButton" type="button">교체</button>
          </header>

          <section class="live-score" aria-labelledby="liveScoreTitle">
            <div class="section-label">
              <h2 id="liveScoreTitle">악보</h2>
              <span id="scoreNotationCount">선택 없음</span>
            </div>
            <div
              class="score-notation"
              id="scoreNotation"
              role="img"
              aria-label="선택된 성부의 악보"
            ></div>
            <div class="measure-navigation">
              <label for="scoreMeasureInput">마디</label>
              <input
                id="scoreMeasureInput"
                type="number"
                min="1"
                value="1"
                inputmode="numeric"
                disabled
              />
              <span id="scoreMeasureTotal">/ 0</span>
            </div>
            <div class="score-lyrics" id="scoreLyrics" aria-hidden="true">
              <div class="score-lyrics-inner">
                <div class="score-lyrics-heading">
                  <span>가사</span>
                  <strong id="scoreLyricsPart"></strong>
                </div>
                <div class="score-lyrics-window">
                  <div class="score-lyrics-track" id="scoreLyricsTrack"></div>
                  <p class="score-lyrics-empty" id="scoreLyricsEmpty"></p>
                </div>
              </div>
            </div>
          </section>

          <div class="playback-core">
            <div class="playback-pulse" id="playbackPulse" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <button class="play-button" id="scorePlayButton" type="button" aria-label="악보 재생">
              <svg class="play-symbol" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14l11-7L8 5Z"></path>
              </svg>
              <svg class="pause-symbol" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 5h4v14H7zM14 5h4v14h-4z"></path>
              </svg>
            </button>
          </div>

          <div class="seek-control">
            <label for="scoreProgress">재생 위치</label>
            <input id="scoreProgress" type="range" min="0" max="1" value="0" step="0.05" />
            <div class="time-row">
              <span id="scoreCurrentTime">0:00</span>
              <span id="scoreDuration">0:00</span>
            </div>
          </div>

          <section class="part-mixer" aria-labelledby="partMixerTitle">
            <div class="section-label">
              <h2 id="partMixerTitle">성부</h2>
              <span>길게 눌러 악보 · 가사</span>
            </div>
            <div class="part-list" id="partList"></div>
          </section>
        </section>

        <p class="score-message" id="scoreMessage" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
